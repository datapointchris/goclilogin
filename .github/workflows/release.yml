name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race to cut the
# same version. Never cancel-in-progress: a canceled release can leave a tag
# with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A library ships as a git tag, so the only thing that must hold is that the
  # tagged commit is green. Publishing a broken tag is unfixable: the module
  # proxy serves any tagged version on demand, caches it permanently, and it
  # cannot be retracted, only superseded.
  #
  # Running before the tag exists is the point. A workflow triggered by the tag
  # has already published the module by the time its checks run.
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/go-semantic-release.yml@v1
    permissions:
      contents: write
    with:
      # Keeps this on 0.x. Without it go-semantic-release forces a major bump on
      # any change while the major is 0, so the next `fix:` would ship 1.0.0.
      # For a library 1.0 is a compatibility promise to every consumer, so it
      # stays a deliberate act: drop this input when the API is settled.
      allow-initial-development-versions: true
      # pkg.go.dev only indexes a version once the proxy has fetched it.
      prime-module-proxy: true
