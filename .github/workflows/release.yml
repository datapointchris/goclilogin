name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A library ships as a git tag, so the only thing that must hold is that the
  # tagged commit is green. Publishing a broken tag is unfixable: the module
  # proxy serves any tagged version on demand, caches it permanently, and it
  # cannot be retracted, only superseded.
  #
  # Running before the tag exists is the point. While releases were cut by hand
  # the trigger was the tag itself, so `git push origin v0.5.0` had already
  # published the module by the time these checks ran — they gated the GitHub
  # Release object, which nothing resolves a module from.
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # allow-initial-development-versions is what keeps this on 0.x. Without it
      # go-semantic-release forces a major bump on *any* change while the major
      # is 0, so the next `fix:` would ship 1.0.0 — which is how bbkt, sess and
      # bashselfupdate all arrived at 1.0.0 on their first automated release.
      # For a library 1.0 is a compatibility promise to every consumer, so it
      # stays a deliberate act: drop this input when the API is settled.
      #
      # No changelog-file: the release body is the changelog. A consumer
      # deciding whether a version matters reads it on the release page, next
      # to the tag they are about to require.
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      # pkg.go.dev only indexes a version once the proxy has fetched it.
      - name: Prime the module proxy
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          module="$(go list -m)"
          curl -fsS "https://proxy.golang.org/${module}/@v/v${VERSION}.info" || \
            echo "proxy has not picked up v${VERSION} yet; it will on first fetch"
