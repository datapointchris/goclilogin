# forge-managed
version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - gocritic
    - misspell
    - nakedret
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Print
        - (*github.com/fatih/color.Color).Println
    gocritic:
      enabled-tags:
        - diagnostic
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    nakedret:
      max-func-lines: 20
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
# gofumpt is deliberately absent, and enforced by the go-fumpt-repo hook
# instead. golangci's copy has no module path, so it reads a module named
# without a dot as stdlib and merges the local imports into the standard block.
# Real gofumpt resolves the path from go.mod and splits them back out, so the two
# rewrote the same files in opposite directions and no such repo could be green
# in both at once.
#
# Passing module-path here cannot work: one config serves every module in a
# repo, and a repo can hold more than one.
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
