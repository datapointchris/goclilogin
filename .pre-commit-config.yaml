# forge-toolchain: 20
fail_fast: true
default_stages: [pre-commit]
repos:

# generated:conventional-commits - Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

# generated:go-release-major - Refuse a commit message that would cut a major release
  - repo: local
    hooks:
      - id: no-major-release-marker
        name: Refuse a commit that would cut a major
        # A major on a Go module here is an outage, not a version: no module path
        # carries a /vN suffix, so `go install …@latest` cannot see the new tag
        # and silently resolves the highest v1 instead. The analyzer matches this
        # marker unanchored against the raw message and ORs it with the
        # configured rules, so .semrelrc cannot stop it and it majors even a
        # `fix:`. Prose could not stop it either — three repos crossed in one
        # evening with the ban already written down.
        #
        # $HOME is not usable here and no script is either: this has to run on
        # any clone, so the whole check is inline. pre-commit execs entry without
        # a shell, hence `bash -c … --`, after which $1 is the message file.
        #
        # Comments are stripped first. git discards them, so a commit template
        # that names the marker must not fail a commit that does not use it.
        entry: bash -c 'grep -vE "^#" "$1" | grep -qiE "breaking[ -]changes?" && { echo "This message would cut a major release, which strands every installed binary."; echo "Use chore(release-major) to major on purpose, or say it another way."; exit 1; }; exit 0' --
        language: system
        stages: [commit-msg]

# generated:file-checks - File format and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --unsafe parses instead of safe_load'ing. Every mkdocs-material repo
      # carries `!!python/name:material.extensions.emoji.twemoji`, which
      # safe_load can never construct — five repos fail this hook without it.
      # The alternative is excluding mkdocs.yml, which checks strictly less.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      # tsconfig.json is JSONC — TypeScript documents comments in it, and the
      # generated one ships with them, so a strict JSON parser is the wrong
      # tool rather than the file being wrong. check-json5 below still parses
      # it, so nothing is unchecked.
      - id: check-json
        exclude: '(^|/)tsconfig(\..*)?\.json$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

# generated:markdown - Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]

# generated:shell - Shell
  #
  # exclude_types: [zsh] on both tools. Neither supports zsh, and neither says
  # so — shellcheck lints a .zshrc as bash and reports nothing, while shfmt
  # reformats it under bash rules, rewriting `>&2 }` to `>&2; }` — correct for
  # bash and unnecessary in zsh. Both were silently out of contract, which is
  # worse than either erroring. identify already tags these files zsh,
  # so this is the native exclusion rather than a path regex that would have to
  # enumerate .zshrc, .zprofile, .zlogin and the rest.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        exclude_types: [zsh]

  # shfmt has no pre-commit hooks file of its own, so this is the repo shfmt's
  # README points at. Its `shfmt` id runs the prebuilt upstream binary, which
  # keeps the hook off a Go toolchain; `shfmt-src` is the one that needs Go.
  #
  # No formatting args on purpose. A parser or printer flag does not merge with
  # .editorconfig — it discards the file wholesale, so adding `--indent 2` here
  # would silently drop switch_case_indent and binary_next_line along with it.
  # Output flags (--write, --diff) are safe. .editorconfig is the style.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude_types: [zsh]

  # bats ships no hook repo of its own, so this one is local.
  #
  # The guard distinguishes "this repo has no tests" from "this repo has tests
  # and bats is missing". Only the first is allowed to pass: a bare `bats
  # tests/` under language: system would be the second hook here to report
  # success because its tool was absent. The first hid seven shellcheck
  # findings behind a green run.
  - repo: local
    hooks:
      - id: bats
        name: bats
        entry: bash -c 'compgen -G "tests/*.bats" > /dev/null || exit 0; exec bats tests/'
        language: system
        pass_filenames: false

# generated:codespell - Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      # Lock files are generated and mostly integrity hashes, so a base64
      # fragment reads as a typo — a package-lock.json hash can contain a
      # two-letter sequence codespell corrects. Nobody writes prose in them and
      # nobody would fix a hit, since the next install would put it back.
      - id: codespell
        # The second alternation is sops output. Ciphertext is base64, so it
        # produces the same false hits a lock file's hashes do. The plain
        # `secrets.yaml` name is covered alongside the *.enc.env convention.
        #
        # `go.mod` sits beside `go.sum` for the same reason one step earlier: it
        # is mostly module paths, and a path is a third party's name rather than
        # prose anyone here can correct. A transitive dependency can carry a
        # module name codespell wants spelled differently, and no edit fixes it —
        # the next `go mod tidy` writes it straight back. Naming such a module
        # here would trip this hook on this very file.
        exclude: '(^|/)(.*-lock\.json|.*\.lock|uv\.lock|package-lock\.json|go\.sum|go\.mod|secrets?[^/]*\.(ya?ml|env|json)|.*\.enc\.[^/]+)$'

# generated:refcheck - Reference checking
  #
  # `--moves` is what earns this a place on every commit, and running without
  # it would be close to running nothing. The whole-tree half — every `source`
  # and `bash` target — finds nothing on a tree that is already clean, which is
  # the normal state. The moves half asks the question a rename actually leaves
  # behind, for each one in the changeset, and that is where the findings are:
  # call sites and documented commands still naming a path that moved.
  #
  # Deliberately no path spelled out above. A comment naming a real old path
  # is itself a hit for it, in every repo this block is deployed to.
  #
  # Generic rather than shell-gated, because a pattern is language-agnostic:
  # the hits land in Go, Vue and Python repos alike, in YAML and prose as
  # readily as in scripts. The compiled languages catch their own broken
  # *imports*, which is a different question from what a doc, a Dockerfile or a
  # shell wrapper still says.
  #
  # No --strict: one advisory warning across every repo, and a warning is
  # about fragility rather than breakage.
  - repo: https://github.com/datapointchris/refcheck
    rev: v0.6.0
    hooks:
      - id: refcheck
        args: [--moves]

# generated:go - Go
  # Every -repo- hook runs in each go.mod it finds, so a repo holding api/ and
  # cli/ needs no hook per module.
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-fumpt-repo
        args: [-w]
      - id: go-vet-repo-mod
      - id: go-build-repo-mod
      - id: go-mod-tidy-repo
      - id: go-test-repo-mod
        # A commit gate runs the fast tests; CI runs everything. Without this a
        # repo with DB integration tests has to keep a hook of its own.
        args: [-short]
      - id: golangci-lint-repo-mod

# generated:github-actions - GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        args: ["-color", "-shellcheck="]
